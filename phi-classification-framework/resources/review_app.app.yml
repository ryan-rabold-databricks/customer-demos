resources:
  apps:
    phi_review_app:
      name: phi-review-${var.env}
      description: Steward review queue for PHI classification decisions. Appends to classification_decision_submission only.
      source_code_path: ../src
      user_api_scopes:
        - iam.current-user:read
      config:
        command: ["uvicorn", "review_app.main:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: PHI_SCAN_JOB_ID
            value_from: scan-job
          - name: PHI_ENV
            value: ${var.env}
          - name: PHI_CATALOG
            value: ${var.catalog}
          - name: PHI_GOVERNANCE_SCHEMA
            value: ${var.governance_schema}
          - name: PHI_TAG_KEY
            value: ${var.tag_key}
          - name: PHI_GOVERNANCE_GROUP
            value: ${var.governance_group}
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: scan-job
          job:
            id: ${resources.jobs.phi_scan.id}
            permission: CAN_MANAGE_RUN
